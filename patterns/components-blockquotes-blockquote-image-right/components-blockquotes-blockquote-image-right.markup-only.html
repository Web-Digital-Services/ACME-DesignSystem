<section class="blockquote-layout">
  <div class="grid-wrapper">
    <div class="grid cols-9-3">
      <div>
        <blockquote>
          <p>A block quotation is set off from the main text as a paragraph or block of text. This version supports an image on the right, standard links and cite links.</p>
          <cite><a href="#">Taylor Eighmy, PhD</a></cite>
        </blockquote>
      </div>
      <div class="blockquote-media blockquote-media-right">
        <img src="../../images/taylor-eighmy.jpg" alt="Portrait of Taylor Eighmy">
      </div>
    </div>
  </div>
</section>
